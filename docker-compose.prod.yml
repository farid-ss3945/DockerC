version: '3.8'

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: always
    environment:
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql

  backend:
    image: ${DOCKERHUB_USERNAME}/neotech-backend:latest
    restart: always
    depends_on:
      - db
    environment:
      ASPNETCORE_URLS: "http://+:5056"
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=NeotechDB;User Id=sa;Password=${MSSQL_SA_PASSWORD};Trust Server Certificate=True;"
      JwtSettings__SecretKey: "${JWT_SECRET_KEY}"
      JwtSettings__Issuer: "${JWT_ISSUER}"
      JwtSettings__Audience: "${JWT_AUDIENCE}"
    ports:
      - "5056:5056" # Keep this so you can still access Swagger via port 5056 if needed

  # ─── Modified Frontend Gateway ──────────────────────────────────────────
  frontend:
    image: nginx:alpine # Using a stock nginx image to act as a gateway router
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80" # The only port the user's browser needs to connect to
    volumes:
      # Mounts your actual compiled React frontend from your image into Nginx
      - frontend_static:/usr/share/nginx/html
    command: >
      /bin/sh -c "echo '
      server {
          listen 80;
          
          # 1. Server your React frontend assets
          location / {
              root /usr/share/nginx/html;
              index index.html index.htm;
              try_files $$uri $$uri/ /index.html;
          }
          
          # 2. Automatically catch and proxy all API requests to the backend container
          location /api/ {
              proxy_pass http://backend:5056;
              proxy_http_version 1.1;
              proxy_set_header Upgrade $$http_upgrade;
              proxy_set_header Connection \"upgrade\";
              proxy_set_header Host $$host;
              proxy_cache_bypass $$http_upgrade;
          }
      }' > /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"

# Share the static files built in your image
volumes:
  mssql_data:
  frontend_static: